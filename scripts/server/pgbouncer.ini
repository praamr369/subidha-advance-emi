;; PgBouncer for Subidha ERP.
;;
;; SESSION pooling, deliberately — not transaction pooling.
;;
;; Transaction pooling gives far better multiplexing, and is the usual
;; recommendation, but it breaks server-side cursors. 41 call sites use
;; QuerySet.iterator(), which psycopg2 implements with a named cursor held
;; across statements. Django's own docs require DISABLE_SERVER_SIDE_CURSORS=True
;; under transaction pooling, and setting that would make those 41 sites buffer
;; entire result sets in memory — on the ledger and stock exports, that is a
;; memory regression traded for pooling nothing is currently waiting on.
;;
;; Session pooling keeps cursors, session state and SET statements working, and
;; still shields PostgreSQL from connection storms.
;;
;; Sizing note (measured 2026-09-04): production ran 12 connections against
;; max_connections 100 with 3 gunicorn workers. These numbers are headroom, not
;; a response to observed pressure.

[databases]
;; The application connects to "subidha" on 6432 and PgBouncer forwards to the
;; real cluster on 5432. Name the target explicitly so a future move of the
;; primary is a change here rather than in the app env.
subidha = host=127.0.0.1 port=5432 dbname=subidha

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; Localhost only. Never bind 0.0.0.0 — PgBouncer would become an unauthenticated
;; path to the database from anywhere the firewall allows.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Session mode: a server connection is held for the life of the client
;; connection and returned on disconnect.
pool_mode = session

;; With CONN_MAX_AGE=60 the app holds connections open between requests, so
;; default_pool_size must comfortably exceed (workers x threads). Currently
;; 3 workers x 4 threads = 12; 25 leaves room to grow to ~6 workers before
;; this needs revisiting.
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Recycle server connections so a long-lived pool cannot pin stale backends.
server_lifetime = 3600
server_idle_timeout = 600

;; Do not add query_wait_timeout below the slowest report. Ledger exports and
;; the trial balance can run for minutes; a short wait timeout would surface as
;; sporadic failures on exactly the heaviest pages.
query_wait_timeout = 120

log_connections = 0
log_disconnections = 0
;; Connection churn logging is noise at this scale and buries real errors.

stats_period = 60
admin_users = postgres
ignore_startup_parameters = extra_float_digits,options
