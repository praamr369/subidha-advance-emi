# ==============================================================================
# SUBIDHA CORE - High-Concurrency Production Nginx Configuration
# Sized for 1,000+ Concurrent Users & High Burst Protection
# Install to: /etc/nginx/sites-available/subidha-core
# Symlink to: /etc/nginx/sites-enabled/subidha-core
# ==============================================================================

# Upstream definitions with persistent keepalive connection pools to eliminate
# TCP connection churn under high request volume (1,000 users).
upstream backend_gunicorn {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream frontend_nextjs {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Rate limiting zones (protects against denial-of-service while allowing burst spikes)
limit_req_zone $binary_remote_addr zone=subidha_api:20m rate=80r/s;
limit_req_zone $binary_remote_addr zone=subidha_auth:10m rate=15r/s;

server {
    listen 80;
    server_name subidhafurnitureasansol.com app.subidhafurnitureasansol.com api.subidhafurnitureasansol.com;

    # Maximum client payload size (for document KYC / photo uploads)
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # Performance buffers
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # Gzip Compression to minimize bandwidth and transfer latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Health checks (direct to backend; no rate limits)
    # --------------------------------------------------------------------------
    location /healthz/ {
        proxy_pass http://backend_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /readyz/ {
        proxy_pass http://backend_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Static Assets: Directly offload from disk (NEVER hit Node.js or Python)
    # --------------------------------------------------------------------------
    # 1. Next.js Static Bundles (JavaScript, CSS, fonts, image chunks)
    location /_next/static/ {
        alias /var/www/subidha/app/frontend/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Django Static Files (Spectacular schema, admin static assets)
    location /static/ {
        alias /var/www/subidha/app/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Media Uploads (Customer KYC documents, delivery photos)
    location /media/ {
        alias /var/www/subidha/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=604800";
    }

    # --------------------------------------------------------------------------
    # Authentication Endpoints (Dedicated protective burst rate limit)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=subidha_auth burst=30 nodelay;

        proxy_pass http://backend_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # General API Endpoints
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=subidha_api burst=120 nodelay;

        proxy_pass http://backend_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Frontend Next.js Web Application (SSR and Client Navigation)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
