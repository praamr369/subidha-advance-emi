[package]
name = "subidha-desktop"
version = "0.1.0"
description = "SUBIDHA CORE - Solopreneur Business Admin Desktop ERP"
authors = ["SUBIDHA CORE"]
edition = "2021"

[lib]
name = "subidha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
