name: release-candidate-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
  push:
    branches:
      - main
      - fix/**

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-release-candidate:
    runs-on: ubuntu-22.04
    env:
      DEPLOY_CHECK_SETTINGS_MODULE: core.settings.ci_deploy
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend release-candidate validation
        run: bash scripts/validate-release-candidate.sh

  frontend-release-candidate:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Frontend release-candidate validation
        run: bash scripts/validate-release-candidate.sh
        env:
          NODE_OPTIONS: '--max-old-space-size=7168'

  frontend-release-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - backend-release-candidate
      - frontend-release-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # Sanity-check the Playwright backend can boot BEFORE Playwright kicks in.
      # Playwright's webServer stdout is easy to lose; if migrate or startup
      # fails here the CI log carries the real traceback.
      - name: Boot Playwright backend (dry-run health check)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.playwright
          PLAYWRIGHT_DB_PATH: /dev/shm/subidha-playwright-smoke.sqlite3
          PLAYWRIGHT_SMOKE_META_PATH: /tmp/subidha-playwright-smoke-meta.json
          PLAYWRIGHT_SMOKE_MANIFEST_PATH: ${{ github.workspace }}/frontend/tests/e2e/.generated/smoke-manifest.json
        run: |
          rm -f "$PLAYWRIGHT_DB_PATH" "$PLAYWRIGHT_SMOKE_META_PATH"
          mkdir -p "$(dirname "$PLAYWRIGHT_SMOKE_MANIFEST_PATH")"
          python manage.py migrate --noinput
          python manage.py seed_playwright_smoke

      - name: Focused release smoke suite
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
          # Reuse the DB + meta primed by the "Boot Playwright backend" step
          # above. Without this flag start_playwright_backend.sh nukes the DB
          # and re-runs the full migrate chain inside Playwright's 420s
          # webServer window — routinely too slow on CI, hits timeout.
          PLAYWRIGHT_SKIP_BOOTSTRAP: "1"
          PLAYWRIGHT_DB_PATH: /dev/shm/subidha-playwright-smoke.sqlite3
          PLAYWRIGHT_SMOKE_META_PATH: /tmp/subidha-playwright-smoke-meta.json
          PLAYWRIGHT_SMOKE_MANIFEST_PATH: ${{ github.workspace }}/frontend/tests/e2e/.generated/smoke-manifest.json
        run: npm run test:e2e:release-smoke

      - name: Upload Playwright smoke artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 1

  # Layer-A.4: whole-surface route-load sweep. Loads every static page for each
  # seeded role (admin/cashier/partner/customer) and fails on a runtime crash.
  # Heavy (~460 pages), so it runs as its own job. Reported (non-blocking) until
  # the full surface is confirmed clean, then flip continue-on-error to false.
  frontend-route-load-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - backend-release-candidate
      - frontend-release-candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-route-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-route-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-route-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Boot Playwright backend (dry-run health check)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: core.settings.playwright
          PLAYWRIGHT_DB_PATH: /dev/shm/subidha-playwright-smoke.sqlite3
          PLAYWRIGHT_SMOKE_META_PATH: /tmp/subidha-playwright-smoke-meta.json
          PLAYWRIGHT_SMOKE_MANIFEST_PATH: ${{ github.workspace }}/frontend/tests/e2e/.generated/smoke-manifest.json
        run: |
          rm -f "$PLAYWRIGHT_DB_PATH" "$PLAYWRIGHT_SMOKE_META_PATH"
          mkdir -p "$(dirname "$PLAYWRIGHT_SMOKE_MANIFEST_PATH")"
          python manage.py migrate --noinput
          python manage.py seed_playwright_smoke

      - name: Route-load smoke (all static pages x role)
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_PYTHON: python
          PLAYWRIGHT_SKIP_BOOTSTRAP: "1"
          PLAYWRIGHT_DB_PATH: /dev/shm/subidha-playwright-smoke.sqlite3
          PLAYWRIGHT_SMOKE_META_PATH: /tmp/subidha-playwright-smoke-meta.json
          PLAYWRIGHT_SMOKE_MANIFEST_PATH: ${{ github.workspace }}/frontend/tests/e2e/.generated/smoke-manifest.json
        run: npm run test:e2e:route-smoke

      - name: Upload route-load smoke artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-route-load-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 1
