name: Build & Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Next.js 16 requires Node ≥20.9.0 (see frontend/node_modules/next/package.json engines).
          # Matches the version used by release-candidate-validation.yml.
          node-version: '20.18.0'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=7168'

      # Deploy is best-effort — a missing/expired VPS_SSH_KEY secret or
      # temporary VPS unreachability should not fail the whole workflow.
      - name: Deploy to VPS
        continue-on-error: true
        if: success()
        env:
          VPS_SSH_KEY: ${{ secrets['VPS_SSH_KEY'] }}
        run: |
          if [[ -z "$VPS_SSH_KEY" ]]; then
            echo "::warning::VPS_SSH_KEY secret is not set; skipping VPS deploy step."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 93.127.195.203 >> ~/.ssh/known_hosts

          # Upload .next folder
          rsync -avz --delete -e ssh frontend/.next/ root@93.127.195.203:/var/www/subidha/app/frontend/.next/

          # Hand ownership to subidha service user if present
          ssh root@93.127.195.203 'if id subidha >/dev/null 2>&1; then chown -R subidha:subidha /var/www/subidha/app/frontend/.next 2>/dev/null || true; fi'

          # Restart Next.js service via systemd if installed, otherwise nohup fallback
          ssh root@93.127.195.203 'systemctl restart subidha-frontend 2>/dev/null || { pkill -f "npm start" || true; cd /var/www/subidha/app/frontend && nohup npm start -- -p 3000 -H 127.0.0.1 > /tmp/npm.log 2>&1 & }'

          echo "✓ Frontend deployed to VPS"
